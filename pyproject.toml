[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qumus-lab"
version = "0.1.0"
description = "Qumus lab PC software: instrument drivers, safety gate and contract v1 module services (exfoliation, stacking)."
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "pyyaml>=6"]

[project.optional-dependencies]
lab = ["opencv-python>=4.8", "numpy>=1.26", "pythonnet>=3.0; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.26"]  # numpy: the live v1 byte comparison imports v1 modules

[project.scripts]
qumus-lab = "qumus_lab.launcher:main"
qumus-probe = "qumus_lab.probe.cli:main"
qumus-selfcheck = "qumus_lab.selfcheck:main"
qumus-state = "qumus_lab.state.__main__:main"
qumus-update = "qumus_lab.update:main"

[tool.setuptools.packages.find]
include = ["qumus_lab*"]

[tool.setuptools.package-data]
qumus_lab = ["web/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
