# Named points: the only place where coordinates live. Actions say "go to point X"; the agent never
# sends raw coordinates (contract rule [Q]).
#
# Frames: an arm point is in that arm's own G-code frame (what v1 sent). Stage/stamp points use the
# axis names of the device (x, y, rail [, z]); `order` is the axis order v1 used.
#
# source: v1  -> copied from v1 (cite = file:line, check = text on that line). A starting guess only.
#               In real mode the SafetyGate refuses go_to_point for a `source: v1` point.
# source: sketch -> a demo-only guess (board-grid sketch), for points v1 never fixed. Refused in real mode.
# source: measured -> measured on the lab PC at L3 (add `measured_by`, `date`). Only these may be
#               driven to in real mode. In --demo every point may be used.
#
# v1 computed many arm points as "stage centre + offset"; the absolute numbers below are those sums
# for v1's fixed stage centres (left (0, 256), right (10, 300); robot_arm_controller.py:115, :141).

version: 1

# Shared zones: an arm must hold the zone's lock (action zone_acquire) before go_to_point sends it to a
# point inside. One holder at a time across both modules (qumus_lab/safety/zones.py). The lock is
# released when the arm finishes a move to a point outside, or by zone_release / a person (zone_clear).
zones:
  middle_board:
    description: "middle board slots S1-S14: hand-over between the left and the right arm"
    devices: [arm_left, arm_right]
    points: ["arm_left.slot_S*", "arm_right.slot_S*"]

