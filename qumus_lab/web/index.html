<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qumus lab bench</title>
<!-- Hearth design system faces (Google Fonts). Offline (lab PC) the page falls back to system fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topnav">
  <div class="topnav__inner">
    <span class="wordmark">Qumus <span class="wordmark__sub">lab bench</span></span>
    <div class="topnav__badges">
      <span id="mode" class="badge">connecting</span>
      <span id="devmode" class="badge badge--dev" hidden
        title="limits.yaml dev_mode: true. Jog and typed-move caps, first-heat caps, switch auto-off cap and move confirmations are off. Heater limits, axis ranges, zone lock and STOP ALL still apply.">Development mode</span>
    </div>
    <div class="topnav__control">
      <span id="leaseinfo" class="muted small" hidden></span>
      <button id="take" type="button" class="btn btn--primary" aria-pressed="false">Take control</button>
    </div>
  </div>
</header>

<div class="layout">
<nav class="side" aria-label="Modules"><div id="modnav" class="side__list" role="tablist"></div></nav>
<div class="content">
<main id="bench" class="bench" aria-live="polite"></main>

<section class="events" aria-label="Events">
  <div class="events__bar">
    <span class="events__dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <h2 class="events__title">Events</h2>
    <label class="events__filter"><input type="checkbox" id="evwarn"> Only warnings and errors</label>
  </div>
  <ol id="events" class="events__list"></ol>
</section>
</div>
</div>

<footer class="estop">
  <span id="stopresult" class="estop__result" role="status"></span>
  <button id="stopall" type="button" class="estop__btn" title="Stops every axis of both modules and switches both heaters off. Works without control. Keyboard: press Esc twice.">
    <span class="estop__icon" aria-hidden="true"><i></i></span>
    <span class="estop__text"><b>STOP ALL</b><small>all axes · heaters off · Esc Esc</small></span>
  </button>
</footer>

<template id="tpl-module">
  <section class="module">
    <div class="statusbar">
      <div class="status"></div>
      <button type="button" class="btn btn--secondary btn--sm readall">Read all</button>
    </div>
    <section class="band band--cams">
      <h2 class="eyebrow visually-hidden">Cameras</h2>
      <div class="cams"></div>
    </section>
    <div class="units"></div>
  </section>
</template>
<script src="app.js"></script>
</body>
</html>
